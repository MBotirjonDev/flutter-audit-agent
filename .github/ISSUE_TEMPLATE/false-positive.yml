name: False positive
description: The scanner flagged something that is not a problem
labels: [false-positive]
body:
  - type: input
    id: rule
    attributes:
      label: Rule id
      placeholder: FSA-NET-002
    validations:
      required: true
  - type: textarea
    id: snippet
    attributes:
      label: Smallest code that triggers it
      render: dart
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why it is safe
    validations:
      required: true
