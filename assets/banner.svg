<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="t d">
  <title id="t">Flutter Audit Agent</title>
  <desc id="d">Your AI coding agent finds the leak before attackers do. Security audits for Flutter and Dart apps.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070B16"/>
      <stop offset="1" stop-color="#0E1A33"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5EC8FF"/>
      <stop offset="1" stop-color="#1F6FEB"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#9FD8FF"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2F81F7" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#2F81F7" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#FFFFFF" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="420" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="420" rx="24" fill="url(#grid)"/>
  <circle cx="230" cy="210" r="230" fill="url(#glow)"/>

  <!-- shield with keyhole -->
  <g transform="translate(130 70)">
    <path d="M100 0 L196 34 V128 C196 196 152 248 100 276 C48 248 4 196 4 128 V34 Z" fill="url(#shield)"/>
    <path d="M100 18 L180 46 V128 C180 186 144 230 100 256 C56 230 20 186 20 128 V46 Z" fill="#0B1428" fill-opacity="0.35"/>
    <circle cx="100" cy="118" r="30" fill="#FFFFFF"/>
    <path d="M86 136 L114 136 L122 196 L78 196 Z" fill="#FFFFFF"/>
    <circle cx="100" cy="118" r="11" fill="#1F6FEB"/>
  </g>

  <!-- scan line -->
  <g opacity="0.9">
    <rect x="110" y="196" width="240" height="3" rx="1.5" fill="#7EE787"/>
    <rect x="110" y="190" width="240" height="15" rx="7" fill="#7EE787" opacity="0.12"/>
  </g>

  <g font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif">
    <text x="420" y="150" font-size="68" font-weight="800" fill="url(#title)" letter-spacing="-1.5">Flutter Audit Agent</text>
    <text x="422" y="204" font-size="27" font-weight="500" fill="#C9D6EA">Your AI coding agent finds the leak</text>
    <text x="422" y="240" font-size="27" font-weight="500" fill="#C9D6EA">before attackers do.</text>
  </g>

  <!-- chips -->
  <g font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="17" font-weight="600">
    <g transform="translate(422 286)">
      <rect width="150" height="40" rx="20" fill="#11213F" stroke="#2F81F7" stroke-opacity="0.6"/>
      <text x="75" y="26" text-anchor="middle" fill="#9FD8FF">OWASP MASVS</text>
    </g>
    <g transform="translate(586 286)">
      <rect width="268" height="40" rx="20" fill="#11213F" stroke="#2F81F7" stroke-opacity="0.6"/>
      <text x="134" y="26" text-anchor="middle" fill="#9FD8FF">Claude Code · Codex · Cursor</text>
    </g>
    <g transform="translate(868 286)">
      <rect width="176" height="40" rx="20" fill="#11213F" stroke="#2F81F7" stroke-opacity="0.6"/>
      <text x="88" y="26" text-anchor="middle" fill="#9FD8FF">Zero dependencies</text>
    </g>
    <g transform="translate(1058 286)">
      <rect width="150" height="40" rx="20" fill="#0F2A1C" stroke="#3FB950" stroke-opacity="0.7"/>
      <text x="75" y="26" text-anchor="middle" fill="#7EE787">GitHub Action</text>
    </g>
  </g>

  <text x="422" y="372" font-family="'JetBrains Mono', SFMono-Regular, Consolas, Menlo, monospace" font-size="18" fill="#6E7F99">$ security audit this flutter app</text>
</svg>
